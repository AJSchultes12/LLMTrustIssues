# Disguise rules for the Enron case (llmtrust/disguise.py).
# Matching: word-boundary; case-insensitive for keys longer than 4 characters,
# case-sensitive for keys of 4 characters or fewer. Longer keys win over shorter ones.
# scale_factor and year_shift are fixed for this case and recorded in each trial: do not change.
# year_shift is 28 because the Gregorian calendar repeats every 28 years (1901-2099),
# so weekdays and day gaps between dates survive.

scale_factor: 0.37
year_shift: 28

# Applied at levels 2 and 3.
names:
  "Enron Corp.": "the Company"
  "Enron Corp/OR/": "the Company"
  "Enron Corporation": "the Company"
  "Enron": "the Company"
  "EnronOnline": "the Company's online trading platform"
  "Kenneth Lay": "the Company's chairman"
  "Kenneth L. Lay": "the Company's chairman"
  "Ken Lay": "the Company's chairman"
  "Lay": "the chairman"
  "Jeffrey Skilling": "the Company's chief executive"
  "Jeffrey K. Skilling": "the Company's chief executive"
  "Jeff Skilling": "the Company's chief executive"
  "Skilling": "the chief executive"
  "Andrew Fastow": "the Company's chief financial officer"
  "Andrew S. Fastow": "the Company's chief financial officer"
  "Andy Fastow": "the Company's chief financial officer"
  "Fastow": "the chief financial officer"
  "Sherron Watkins": "a vice president"
  "Watkins": "the vice president"
  "Arthur Andersen": "the outside auditor"
  "Andersen": "the outside auditor"
  "Vinson & Elkins": "outside counsel"
  "Houston": "a Gulf Coast city"
  "Portland General": "a regulated electric utility subsidiary"

# Applied at level 3 only: partnership and vehicle names.
structures:
  "LJM Cayman": "Partnership Three"
  "LJM1": "Partnership One"
  "LJM2": "Partnership Two"
  "LJM": "Partnership"
  "Raptors": "Vehicles"
